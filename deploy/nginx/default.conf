server {
    listen 80;
    server_name _;
    root /app/public;
    index index.php;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # PWA: service worker must be revalidated (never long-cached) or
    # browsers will not pick up updates. The manifest needs the correct
    # MIME type or Chrome will not treat it as a web app manifest.
    location = /sw.js {
        default_type text/javascript;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(webmanifest)$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Static assets: long cache
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PHP front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # TLS is terminated by the Dokploy reverse proxy, which forwards
        # X-Forwarded-Proto. Map that to PHP's HTTPS flag so the app can
        # build correct canonical URLs (webhook signature validation needs
        # the https scheme to match Twilio's configured webhook URL).
        set $pp_https off;
        if ($http_x_forwarded_proto = 'https') { set $pp_https on; }
        fastcgi_param HTTPS $pp_https;
        fastcgi_read_timeout 60s;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block direct access to sensitive dirs
    location ~ ^/(app|config|database|storage|templates|bin|vendor)/ {
        deny all;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
